{% load static %}<html lang='ru'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Kindred — Меню</title><link rel='stylesheet' href="{% static 'css_style.css' %}"></head><body><main class='container' style='padding:50px 0'><a href='{% url 'home' %}'>← На главную</a><h1>Меню</h1><div class='menu-cards quest-cards'>{% for dish in dishes %}<article class="menu-card"><h3>{{ dish.name }}</h3><p>{{ dish.description }}</p><strong>{{ dish.price }} ₸</strong></article>{% empty %}<p>Меню пока пустое. Добавьте блюда в админке.</p>{% endfor %}</div></main></body></html>
